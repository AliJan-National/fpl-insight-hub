name: regression
on:
  push:
  pull_request:
jobs:
  test:
    # automated data pushes carry their own non-blocking report inside the
    # data-refresh workflow — skip the duplicate here to avoid double noise
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
